name: Restore Medisafe src structure

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  restore-and-build:
    if: ${{ !contains(github.event.head_commit.message, 'Restore TanStack Start src structure') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Restore original src structure
        shell: bash
        run: |
          set -euo pipefail

          move_if_exists() {
            local src="$1"
            local dst="$2"

            if [ -e "$src" ]; then
              mkdir -p "$(dirname "$dst")"
              if [ -e "$dst" ]; then
                echo "Target already exists, leaving it: $dst"
              else
                echo "Moving $src -> $dst"
                git mv "$src" "$dst"
              fi
            fi
          }

          # Core TanStack files
          move_if_exists "router.tsx" "src/router.tsx"
          move_if_exists "start.ts" "src/start.ts"
          move_if_exists "server.ts" "src/server.ts"
          move_if_exists "routeTree.gen.ts" "src/routeTree.gen.ts"
          move_if_exists "styles.css" "src/styles.css"

          # Public/root routes
          move_if_exists "__root.tsx" "src/routes/__root.tsx"
          move_if_exists "_authenticated.tsx" "src/routes/_authenticated.tsx"
          move_if_exists "index.tsx" "src/routes/index.tsx"
          move_if_exists "auth.tsx" "src/routes/auth.tsx"
          move_if_exists "reset-password.tsx" "src/routes/reset-password.tsx"

          # Authenticated routes
          move_if_exists "alerts.tsx" "src/routes/_authenticated/alerts.tsx"
          move_if_exists "dashboard.tsx" "src/routes/_authenticated/dashboard.tsx"
          move_if_exists "health.tsx" "src/routes/_authenticated/health.tsx"
          move_if_exists "medications.tsx" "src/routes/_authenticated/medications.tsx"
          move_if_exists "prescriptions.tsx" "src/routes/_authenticated/prescriptions.tsx"
          move_if_exists "profile.tsx" "src/routes/_authenticated/profile.tsx"

          # App components
          move_if_exists "AppShell.tsx" "src/components/app/AppShell.tsx"

          # UI components
          for f in accordion alert-dialog alert aspect-ratio avatar badge breadcrumb button calendar card carousel chart checkbox collapsible command context-menu dialog drawer dropdown-menu form hover-card input-otp input label menubar navigation-menu pagination popover progress radio-group resizable scroll-area select separator sheet sidebar skeleton slider sonner switch table tabs textarea toggle-group toggle tooltip; do
            move_if_exists "$f.tsx" "src/components/ui/$f.tsx"
          done

          # Hooks
          move_if_exists "use-mobile.tsx" "src/hooks/use-mobile.tsx"
          move_if_exists "useAuth.tsx" "src/hooks/useAuth.tsx"

          # Services
          move_if_exists "alertService.ts" "src/services/alertService.ts"
          move_if_exists "api.ts" "src/services/api.ts"
          move_if_exists "backendApi.ts" "src/services/backendApi.ts"
          move_if_exists "logService.ts" "src/services/logService.ts"
          move_if_exists "medicationService.ts" "src/services/medicationService.ts"
          move_if_exists "prescriptionService.ts" "src/services/prescriptionService.ts"
          move_if_exists "profileService.ts" "src/services/profileService.ts"
          move_if_exists "scheduleEngine.ts" "src/services/scheduleEngine.ts"
          move_if_exists "vitalService.ts" "src/services/vitalService.ts"
          move_if_exists "types (1).ts" "src/services/types.ts"

          # Supabase integration
          move_if_exists "client.ts" "src/integrations/supabase/client.ts"
          move_if_exists "client.server.ts" "src/integrations/supabase/client.server.ts"
          move_if_exists "types.ts" "src/integrations/supabase/types.ts"
          move_if_exists "auth-attacher.ts" "src/integrations/supabase/auth-attacher.ts"
          move_if_exists "auth-middleware.ts" "src/integrations/supabase/auth-middleware.ts"

          # Lib
          move_if_exists "utils.ts" "src/lib/utils.ts"
          move_if_exists "lovable-error-reporting.ts" "src/lib/lovable-error-reporting.ts"
          move_if_exists "error-capture.ts" "src/lib/error-capture.ts"
          move_if_exists "error-page.ts" "src/lib/error-page.ts"
          move_if_exists "account.functions.ts" "src/lib/account.functions.ts"
          move_if_exists "interactions.functions.ts" "src/lib/interactions.functions.ts"
          move_if_exists "interactions.server.ts" "src/lib/interactions.server.ts"

          echo "=== resulting src tree ==="
          find src -maxdepth 4 -type f | sort

          echo "=== git status ==="
          git status --short

      - name: Install dependencies
        run: bun install

      - name: Build
        id: build
        continue-on-error: true
        run: bun run build 2>&1 | tee build.log
        shell: bash

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: medisafe-build-log
          path: build.log
          if-no-files-found: warn

      - name: Commit restored structure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No structural changes to commit."
          else
            git commit -m "Restore TanStack Start src structure"
            git push origin main
          fi

      - name: Fail if build failed
        if: steps.build.outcome == 'failure'
        run: |
          echo "Build failed after restoring the src structure."
          echo "The restored structure has still been committed so the next Vercel build can use it."
          exit 1
