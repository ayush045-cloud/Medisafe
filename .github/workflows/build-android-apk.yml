name: Build Medisafe Android APK

on:
  push:
    branches:
      - feature/android-expo-app
  pull_request:
    branches:
      - main
    paths:
      - 'mobile/**'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure mobile environment
        working-directory: mobile
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
        run: |
          set -eu
          test -n "$EXPO_PUBLIC_SUPABASE_URL" || (echo "Missing GitHub secret: EXPO_PUBLIC_SUPABASE_URL" && exit 1)
          test -n "$EXPO_PUBLIC_SUPABASE_ANON_KEY" || (echo "Missing GitHub secret: EXPO_PUBLIC_SUPABASE_ANON_KEY" && exit 1)
          test -n "$EXPO_PUBLIC_API_URL" || (echo "Missing GitHub secret: EXPO_PUBLIC_API_URL" && exit 1)
          {
            printf 'EXPO_PUBLIC_SUPABASE_URL=%s\\n' "$EXPO_PUBLIC_SUPABASE_URL"
            printf 'EXPO_PUBLIC_SUPABASE_ANON_KEY=%s\\n' "$EXPO_PUBLIC_SUPABASE_ANON_KEY"
            printf 'EXPO_PUBLIC_API_URL=%s\\n' "$EXPO_PUBLIC_API_URL"
          } > .env
      - name: Install mobile dependencies
        working-directory: mobile
        run: npm install
      - name: Align dependencies with Expo SDK
        working-directory: mobile
        run: npx expo install --fix
      - name: Generate Android project
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install
      - name: Diagnose Expo Android autolinking modules
        working-directory: mobile
        run: |
          echo "=== Expo module resolution ==="
          npx expo-modules-autolinking resolve --platform android
          echo "=== Expo module config files ==="
          find node_modules -name expo-module.config.json -print
      - name: Build installable debug APK
        working-directory: mobile/android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: medisafe-android-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
